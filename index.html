  <script>
    (() => {
      "use strict";

      const player = document.getElementById("player");
      const source = document.getElementById("videoSource");
      const loading = document.getElementById("loading");
      const videoInfo = document.getElementById("videoInfo");

      document.getElementById("year").textContent =
        new Date().getFullYear();

      const DEFAULT_VIDEO = "https://cdn.videy.co/AAU8a62J1.mp4";
      const VIDEO_BASE = "https://cdn.videy.co/";

      function resolveVideo(value) {
        if (!value) {
          return DEFAULT_VIDEO;
        }

        const input = value.trim();

        // Terima URL video lengkap dengan protokol HTTP/HTTPS.
        if (/^https?:\/\//i.test(input)) {
          try {
            const url = new URL(input);

            if (!["http:", "https:"].includes(url.protocol)) {
              return DEFAULT_VIDEO;
            }

            return url.href;
          } catch {
            return DEFAULT_VIDEO;
          }
        }

        // ID video harus berupa karakter yang aman untuk URL.
        // Contoh: ?v=AAU8a62J1
        if (!/^[a-zA-Z0-9_-]+(?:\.mp4)?$/.test(input)) {
          return DEFAULT_VIDEO;
        }

        const filename = /\.mp4$/i.test(input)
          ? input
          : input + ".mp4";

        return VIDEO_BASE + filename;
      }

      function showLoading(message) {
        loading.textContent = message;
        loading.hidden = false;
      }

      function hideLoading() {
        loading.hidden = true;
      }

      function showError() {
        showLoading("Unable to load video. Please try again.");
        videoInfo.textContent =
          "The video could not be loaded. Check your connection or try another video.";
      }

      // Baca parameter ?v= dari URL halaman.
      const params = new URLSearchParams(window.location.search);
      const videoUrl = resolveVideo(params.get("v"));

      player.addEventListener("loadstart", () => {
        showLoading("Loading video...");
      });

      player.addEventListener("waiting", () => {
        showLoading("Buffering video...");
      });

      player.addEventListener("canplay", hideLoading);
      player.addEventListener("playing", hideLoading);
      player.addEventListener("error", showError);

      player.addEventListener("ended", () => {
        videoInfo.textContent = "This video has finished playing.";
      });

      // Set URL lalu mulai memuat video.
      source.src = videoUrl;
      player.load();

      // Autoplay dicoba dalam mode mute.
      // Browser mungkin tetap meminta pengguna menekan Play.
      const playPromise = player.play();

      if (playPromise && typeof playPromise.catch === "function") {
        playPromise.catch(() => {
          hideLoading();
          videoInfo.textContent =
            "Tap play to start watching the video.";
        });
      }
    })();
  </script>
